version: "3.8"

services:
  # 1. Enterprise PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: eslami_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: eslami_global_trading
      POSTGRES_USER: eslami_db_root
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-eslami_secure_db_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
    ports:
      - "127.0.0.1:5432:5432" # Bind locally for security, accessible only on host loopback
    networks:
      - eslami_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eslami_db_root -d eslami_global_trading"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Buffering Broker Service
  redis:
    image: redis:7.2-alpine
    container_name: eslami_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-eslami_redis_secure_pass_2026} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379" # Bound locally for maximum port hardening
    networks:
      - eslami_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-eslami_redis_secure_pass_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Full-Stack Node Application Runner (Vite Client + Express Backend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eslami_app_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://eslami_db_root:${DB_ROOT_PASSWORD:-eslami_secure_db_pass_2026}@db:5432/eslami_global_trading?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-eslami_redis_secure_pass_2026}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-eslami_session_secure_random_key_2026}
      JWT_SECRET: ${JWT_SECRET:-eslami_jwt_secure_random_key_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      STORAGE_PROVIDER: LOCAL_DISK
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:3000:3000" # Internal proxy routing bind
    networks:
      - eslami_network

  # 4. Production Edge Nginx Proxy Service
  nginx:
    image: nginx:alpine
    container_name: eslami_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - eslami_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  eslami_network:
    driver: bridge
