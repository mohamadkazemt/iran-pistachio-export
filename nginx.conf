# ==============================================================================
#  ESLAMI GLOBAL TRADING - NGINX OPTIMIZED REVERSE PROXY CONFIGURATION
# ==============================================================================
# Save to: /etc/nginx/sites-available/eslami-global.com
# Use symlink: ln -sf /etc/nginx/sites-available/eslami-global.com /etc/nginx/sites-enabled/
# ==============================================================================

# Rate limit registry zone for brute-force prevention
limit_req_zone $binary_remote_addr zone=api_limit_zone:15m rate=10r/s;

# Dynamic Connection Limiting (max 20 concurrent connects from single IP)
limit_conn_zone $binary_remote_addr zone=addr_conn_zone:15m;

# ----------------- HTTP Port 80 (Redirect to HTTPS) -----------------
server {
    listen 80;
    listen [::]:80;
    server_name eslami-global.com www.eslami-global.com;

    # Let's Encrypt ACME Challenge Directory Handler
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Global HTTP -> HTTPS Redirection
    location / {
        return 301 https://$host$request_uri;
    }

    # Cybersecurity Hardening: Hide Nginx signature versions
    server_tokens off;
}

# ----------------- HTTPS Port 443 (Secure Reverse Proxy) -----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eslami-global.com www.eslami-global.com;

    # SSL Sourcing Certificates (Certbot populates these automatically)
    ssl_certificate /etc/letsencrypt/live/eslami-global.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/eslami-global.com/privkey.pem; # managed by Certbot
    
    # Secure SSL Protocols Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    
    # Session caching parameters
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling validation
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Cybersecurity Security Headers Block
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Compression Pipeline (Gzip)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Default application root
    root /var/www/html;
    index index.html;

    # Hide Nginx signature versions
    server_tokens off;

    # Media / Document cache optimizing headers
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg|mp4|webm|pdf)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # API Routes Proxies (Enabled with rate limit parameters and IP grouping limits)
    location /api/ {
        # Limit API calls per single IP
        limit_req zone=api_limit_zone burst=15 nodelay;
        limit_conn addr_conn_zone 15;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Client App Router proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }
}
